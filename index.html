<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Благотворительный фонд — Поддержка</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Подключение виджета CloudPayments -->
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Поддержите наш фонд</h1>
            <p class="subtitle">Ваша помощь меняет жизни</p>
        </header>

        <form id="donationForm" class="donation-form">
            <!-- Сумма пожертвования -->
            <div class="form-group">
                <label for="amount">Сумма пожертвования (₽)</label>
                <input type="number" id="amount" name="amount" min="1" step="1" value="500" required>
            </div>

            <!-- Выбор рекуррентности -->
            <div class="form-group">
                <label>Периодичность платежа</label>
                <div class="recurrence-selector">
                    <label class="radio-label">
                        <input type="radio" name="recurrence" value="one-time" checked>
                        <span class="radio-custom"></span>
                        Разовый платёж
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="recurrence" value="monthly">
                        <span class="radio-custom"></span>
                        Ежемесячно
                    </label>
                </div>
            </div>

            <!-- ФИО -->
            <div class="form-group">
                <label for="fullName">ФИО</label>
                <input type="text" id="fullName" name="fullName" placeholder="Иванов Иван Иванович" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <!-- Телефон -->
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
            </div>

            <!-- Комментарий -->
            <div class="form-group">
                <label for="comment">Комментарий</label>
                <textarea id="comment" name="comment" rows="3" placeholder="Ваше сообщение (необязательно)"></textarea>
            </div>

            <!-- Чекбокс для подтверждения рекуррентности (дублирует селектор) -->
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="makeRecurrent">
                    <span class="checkbox-custom"></span>
                    Сделать платёж ежемесячным
                </label>
                <p class="checkbox-hint">При активации после успешного платежа будет создана подписка с ежемесячным списанием.</p>
            </div>

            <!-- Кнопки оплаты -->
            <div class="button-group">
                <button type="submit" class="btn btn-primary" id="payButton">
                    Оплатить
                </button>
                <button type="button" class="btn btn-secondary" id="quickPayButton">
                    Оплатить в один клик
                </button>
            </div>
        </form>

        <div id="resultMessage" class="result-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
